<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>PedsDose — Pediatric Emergency Reference</title>
<style>
:root{--bg:#f5f6fa;--surface:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--nav:#fff;--shadow:0 6px 20px rgba(16,24,40,.06)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{-webkit-tap-highlight-color:transparent}body{padding-bottom:78px}
.app{width:100%;max-width:480px;margin:auto}
header{position:sticky;top:0;z-index:30;background:rgba(245,246,250,.94);backdrop-filter:blur(18px);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:9px}
.logo{width:38px;height:38px;border-radius:12px;background:#101828;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900}
.brand strong{font-size:16px;letter-spacing:-.3px}.brand small{display:block;font-size:9px;color:var(--muted);font-weight:700;margin-top:1px}
.header-actions{display:flex;gap:6px}.icon{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
main{padding:10px 12px 20px}
.search{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px 0 40px;font-size:14px;outline:none;box-shadow:var(--shadow)}
.searchbox{position:relative;margin-bottom:8px}.searchbox span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#98a2b3;font-size:17px}
.weight{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 9px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow);margin-bottom:9px}
.weight label{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.5px;margin-right:auto}
.weight button{width:36px;height:36px;border:0;background:#f2f4f7;border-radius:10px;font-size:20px;font-weight:800}.weight input{width:58px;height:36px;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:17px;font-weight:900;outline:0}.kg{font-size:10px;font-weight:900;color:var(--muted);margin-right:3px}
.chips{display:flex;gap:6px;overflow:auto;padding:1px 0 9px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 11px;font-size:10px;font-weight:900;color:#475467}
.chip.active{background:#101828;color:#fff;border-color:#101828}
.section{border-radius:17px;overflow:hidden;margin-bottom:10px;border:1px solid var(--c-line);background:var(--c-bg)}
.section-head{padding:10px 12px;display:flex;align-items:center;gap:8px;color:var(--c);border-bottom:1px solid var(--c-line)}
.section-icon{width:27px;height:27px;border-radius:9px;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:14px}
.section-title{font-size:12px;font-weight:950}.section-count{margin-left:auto;font-size:9px;color:var(--muted);font-weight:800}
.cards{display:grid;gap:7px;padding:7px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--c-line);border-left:4px solid var(--c);border-radius:13px;padding:10px 10px 9px}
.cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}.drug{font-size:14px;font-weight:950;line-height:1.2}
.route{flex:none;font-size:8px;font-weight:950;color:var(--c);background:#fff;border:1px solid var(--c-line);padding:4px 6px;border-radius:7px}
.indication{display:inline-block;color:var(--c);font-size:9px;font-weight:850;margin:5px 0 7px}
.dosebox{background:#f8fafc;border-radius:9px;padding:7px 8px}.label{font-size:7px;color:#7b8494;text-transform:uppercase;letter-spacing:.7px;font-weight:950}
.formula{font-size:16px;font-weight:950;line-height:1.15;margin-top:2px}.calclabel{margin-top:6px}.calc{font-size:20px;font-weight:950;color:var(--c);line-height:1.1;margin-top:2px;min-height:0}
.calc.empty{display:none}.note{font-size:9px;line-height:1.3;color:#667085;margin-top:6px}
.empty{text-align:center;padding:35px 15px;color:var(--muted);font-size:12px}
.admin{display:none}.admin.show{display:block}.admin-title{font-size:19px;font-weight:950;margin:4px 0 2px}.admin-sub{font-size:10px;color:var(--muted);margin-bottom:10px}
.adminbar{display:flex;gap:7px;margin-bottom:9px}.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:10px;font-weight:900}.btn.primary{background:#101828;color:#fff;border-color:#101828}.btn.danger{color:#dc2626}
.table{display:grid;gap:6px}.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px;display:flex;align-items:center;gap:8px}.rowmain{min-width:0;flex:1}.rowname{font-size:11px;font-weight:950}.rowsub{font-size:8px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row button{padding:7px 8px}
.auth{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:9px}.auth strong{font-size:11px}.auth small{display:block;color:var(--muted);font-size:9px;margin:2px 0 8px}.auth-actions{display:flex;gap:6px}.auth-actions .btn{flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:5px}
.nav button{width:min(220px,48%);border:0;background:transparent;border-radius:11px;padding:7px 4px;color:#667085;font-size:9px;font-weight:950}.nav button.active{background:#101828;color:#fff}
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.5);display:none;align-items:flex-end}.modal-bg.show{display:flex}.modal{background:var(--surface);width:100%;max-width:480px;margin:auto;border-radius:20px 20px 0 0;padding:15px;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:17px}.form{display:grid;gap:9px}.field label{display:block;font-size:9px;font-weight:900;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;outline:0;font-size:12px}.field textarea{min-height:70px}.modal-actions{display:flex;gap:7px;margin-top:12px}.modal-actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,10px);background:#101828;color:#fff;padding:9px 13px;border-radius:10px;font-size:10px;font-weight:800;opacity:0;pointer-events:none;z-index:150;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.dark{--bg:#090e18;--surface:#111827;--ink:#f2f4f7;--muted:#98a2b3;--line:#273449}.dark header{background:rgba(9,14,24,.94)}.dark .logo{background:#f2f4f7;color:#101828}.dark .search,.dark .weight,.dark .card,.dark .auth,.dark .row,.dark .modal,.dark .icon,.dark .btn{background:var(--surface);color:var(--ink)}.dark .weight button,.dark .dosebox{background:#172033}.dark .route{background:#172033}.dark .nav{background:rgba(17,24,39,.97)}.dark .nav button.active{background:#f2f4f7;color:#101828}.dark .field input,.dark .field select,.dark .field textarea{background:#0f172a;color:#fff;border-color:#273449}
@media(min-width:481px){body{background:#e9edf3}.app{background:var(--bg);min-height:100vh}}
</style>
</head>
<body>
<div class="app">
<header><div class="headrow">
<div class="brand"><div class="logo">Rx</div><div><strong>PedsDose</strong><small>Pediatric Emergency Reference</small></div></div>
<div class="header-actions"><button class="icon" id="themeBtn" aria-label="Dark mode">☾</button></div>
</div></header>

<main>
<div id="reference">
<div class="searchbox"><span>⌕</span><input id="search" class="search" placeholder="Search drug, indication or route…" autocomplete="off"></div>
<div class="weight"><label>Patient weight</label><button id="minus">−</button><input id="weight" inputmode="decimal" type="number" min="0" step=".1" placeholder="—"><span class="kg">kg</span><button id="plus">+</button></div>
<div id="chips" class="chips"></div>
<div id="categories"></div>
</div>

<div id="admin" class="admin">
<div class="admin-title">Medication manager</div><div class="admin-sub">Private controls for the authorized administrator.</div>
<div class="auth"><strong id="authStatus">Admin access: checking…</strong><small id="authHelp">Sign in to enable editing.</small><div class="auth-actions"><button class="btn primary" id="login">🔐 Sign in</button><button class="btn" id="logout" style="display:none">Sign out</button></div></div>
<div class="adminbar"><button class="btn primary" id="add">＋ Add drug</button><button class="btn" id="catsBtn">Categories</button></div>
<div id="adminList" class="table"></div>
</div>
</main>

<nav class="nav"><button id="refTab" class="active">📖<br>REFERENCE</button><button id="adminTab">⚙️<br>MANAGE</button></nav>
<div id="modal" class="modal-bg"></div><div id="toast" class="toast"></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
const firebaseConfig={
 apiKey:"AIzaSyA-clqoD7YiAxQbI1WRg4A5hhRup4YuyrE",authDomain:"ed-drugs.firebaseapp.com",
 databaseURL:"https://ed-drugs-default-rtdb.firebaseio.com",projectId:"ed-drugs",
 storageBucket:"ed-drugs.firebasestorage.app",messagingSenderId:"101110196513",appId:"1:101110196513:web:40559131c06e8254093660"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);
const ADMIN_UID="VGZEI0YX70W1IOFORIGu1HFAhlB2";
const defaultDrugs = [
{name:"Epinephrine",category:"Cardiac Arrest & Arrhythmias",indication:"Cardiac arrest • PEA/asystole",route:"IV/IO",type:"mg/kg",dose:"0.01",note:"0.1 mg/mL • Repeat q3–5 min"},
{name:"Amiodarone",category:"Cardiac Arrest & Arrhythmias",indication:"VF/pVT",route:"IV/IO",type:"mg/kg",dose:"5",note:""},
{name:"Lidocaine",category:"Cardiac Arrest & Arrhythmias",indication:"VF/pVT",route:"IV/IO",type:"mg/kg",dose:"1",note:""},
{name:"Atropine",category:"Cardiac Arrest & Arrhythmias",indication:"Bradycardia",route:"IV/IO",type:"mg/kg",dose:"0.02",note:""},
{name:"Adenosine",category:"Cardiac Arrest & Arrhythmias",indication:"SVT",route:"IV/IO",type:"mg/kg",dose:"0.1 → 0.2",note:"First dose 0.1 mg/kg, then 0.2 mg/kg"},
{name:"0.9% NaCl",category:"Shock & Sepsis",indication:"Shock / sepsis",route:"IV/IO",type:"mL/kg",dose:"10–20",note:"Bolus • Reassess"},
{name:"D10",category:"Shock & Sepsis",indication:"Hypoglycemia",route:"IV/IO",type:"mL/kg",dose:"2",note:""},
{name:"Epinephrine",category:"Anaphylaxis & Allergy",indication:"Anaphylaxis",route:"IM",type:"mg/kg",dose:"0.01",note:"1 mg/mL (1:1000) • Max 0.5 mg"},
{name:"Diphenhydramine",category:"Anaphylaxis & Allergy",indication:"Allergic reaction",route:"IV/IM/PO",type:"mg/kg",dose:"1",note:""},
{name:"Methylprednisolone",category:"Anaphylaxis & Allergy",indication:"Allergy / asthma",route:"IV/IO",type:"mg/kg",dose:"1–2",note:""},
{name:"Midazolam",category:"Seizures",indication:"Seizure / status",route:"IV/IO",type:"mg/kg",dose:"0.15",note:""},
{name:"Midazolam",category:"Seizures",indication:"Seizure / status",route:"IM",type:"mg/kg",dose:"0.2",note:""},
{name:"Midazolam",category:"Seizures",indication:"Seizure / status",route:"IN / buccal",type:"mg/kg",dose:"0.3",note:""},
{name:"Diazepam",category:"Seizures",indication:"Seizure / status",route:"IV/IO",type:"mg/kg",dose:"0.1–0.4",note:""},
{name:"Diazepam",category:"Seizures",indication:"Seizure / status",route:"PR",type:"mg/kg",dose:"0.3–0.5",note:""},
{name:"Levetiracetam",category:"Seizures",indication:"Status • 2nd line",route:"IV",type:"mg/kg",dose:"40–60",note:""},
{name:"Phenytoin",category:"Seizures",indication:"Status • 2nd line",route:"IV",type:"mg/kg",dose:"20",note:""},
{name:"Phenobarbital",category:"Seizures",indication:"Status • 2nd line",route:"IV",type:"mg/kg",dose:"20",note:""},
{name:"Salbutamol",category:"Asthma & Wheeze",indication:"Raised K / hyperkalemia",route:"Nebulized",type:"fixed",dose:"2.5–5 mg",note:"Fixed dose"},
{name:"Insulin + glucose",category:"Shock & Sepsis",indication:"Raised K / hyperkalemia",route:"IV",type:"U/kg",dose:"0.1",note:"Regular insulin • glucose per protocol"},
{name:"Salbutamol",category:"Asthma & Wheeze",indication:"Asthma / wheeze",route:"Neb",type:"fixed",dose:"2.5 mg (<20 kg) / 5 mg (>20 kg)",note:"Weight-based fixed dose"},
{name:"Ipratropium",category:"Asthma & Wheeze",indication:"Asthma / wheeze",route:"Neb",type:"fixed",dose:"0.25–0.5 mg",note:"Fixed dose"},
{name:"Magnesium sulfate",category:"Asthma & Wheeze",indication:"Severe asthma",route:"IV",type:"mg/kg",dose:"25–50",note:""},
{name:"Calcium chloride 10%",category:"Shock & Sepsis",indication:"Raised K / hyperkalemia",route:"IV/IO",type:"mg/kg",dose:"20",note:""},
{name:"Dexamethasone",category:"Airway / Croup",indication:"Croup",route:"PO/IV/IM",type:"mg/kg",dose:"0.15–0.6",note:""},
{name:"Adrenaline",category:"Airway / Croup",indication:"Croup",route:"Neb",type:"mL/kg",dose:"0.5",note:"1:1000 • Max 5 mL"},
{name:"Ketamine",category:"Airway / RSI",indication:"RSI • induction",route:"IV/IO",type:"mg/kg",dose:"1–2",note:""},
{name:"Etomidate",category:"Airway / RSI",indication:"RSI • induction",route:"IV",type:"mg/kg",dose:"0.3",note:""},
{name:"Rocuronium",category:"Airway / RSI",indication:"RSI • paralysis",route:"IV/IO",type:"mg/kg",dose:"1–1.2",note:""},
{name:"Succinylcholine",category:"Airway / RSI",indication:"RSI • paralysis",route:"IV/IO",type:"mg/kg",dose:"1–2",note:""},
{name:"Morphine",category:"Pain & Fever",indication:"Pain",route:"IV",type:"mg/kg",dose:"0.05–0.1",note:""},
{name:"Fentanyl",category:"Pain & Fever",indication:"Pain",route:"IV/IN",type:"mcg/kg",dose:"1–2",note:""},
{name:"Ketamine",category:"Pain & Fever",indication:"Analgesia",route:"IV",type:"mg/kg",dose:"0.1–0.3",note:""},
{name:"Paracetamol",category:"Pain & Fever",indication:"Fever / pain",route:"PO/IV",type:"mg/kg",dose:"15",note:""},
{name:"Ibuprofen",category:"Pain & Fever",indication:"Fever / pain",route:"PO",type:"mg/kg",dose:"10",note:""},
{name:"Ondansetron",category:"Other Emergencies",indication:"Vomiting",route:"PO/IV/IM",type:"mg/kg",dose:"0.15",note:""},
{name:"Naloxone",category:"Other Emergencies",indication:"Opioid toxicity",route:"IV/IM/IN",type:"mg/kg",dose:"0.1",note:""},
{name:"Flumazenil",category:"Other Emergencies",indication:"Benzodiazepine toxicity",route:"IV",type:"mg/kg",dose:"0.01",note:""},
{name:"Zet",category:"Anaphylaxis & Allergy",indication:"Anaphylaxis / allergy",route:"PO",type:"fixed",dose:"See local protocol",note:"User-supplied medication entry — verify exact generic name and dose before clinical use"}
];

const cats = {
"Cardiac Arrest & Arrhythmias":{icon:"♥",color:"#dc2626",bg:"#fff6f5",line:"#fecaca"},
"Seizures":{icon:"✦",color:"#7c3aed",bg:"#faf7ff",line:"#ddd6fe"},
"Shock & Sepsis":{icon:"✹",color:"#ea580c",bg:"#fff9f2",line:"#fed7aa"},
"Anaphylaxis & Allergy":{icon:"⚕",color:"#0891b2",bg:"#f2fcfe",line:"#bae6fd"},
"Asthma & Wheeze":{icon:"♧",color:"#16a34a",bg:"#f3fbf4",line:"#bbf7d0"},
"Airway / Croup":{icon:"◉",color:"#0284c7",bg:"#f3f9ff",line:"#bfdbfe"},
"Airway / RSI":{icon:"⚡",color:"#2563eb",bg:"#f4f8ff",line:"#bfdbfe"},
"Pain & Fever":{icon:"✚",color:"#d97706",bg:"#fffbf1",line:"#fde68a"},
"Other Emergencies":{icon:"●",color:"#db2777",bg:"#fff6fa",line:"#fbcfe8"}
};

let drugs=defaultDrugs.map((d,i)=>({...d,id:d.id||("local-"+i)}));
let weight="";
let active="All",query="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
function saveLocal(){localStorage.setItem("pedsDoseWeight",weight);localStorage.setItem("pedsDoseDrugs",JSON.stringify(drugs));localStorage.setItem("pedsDoseCats",JSON.stringify(cats));}
function saveCloud(){if(!isAdmin)return;const x={};drugs.forEach(d=>x[d.id]=d);set(ref(db,"medications"),x);set(ref(db,"categories"),cats);saveLocal();}
function parseNums(s){return String(s).match(/\d+(?:\.\d+)?/g)?.map(Number)||[]}
function calc(d){if(!weight||d.type==="fixed")return "";let nums=parseNums(d.dose),w=Number(weight);if(!nums.length)return "";let vals=nums.map(n=>n*w);let unit=d.type==="mcg/kg"?"mcg":d.type==="mL/kg"?"mL":d.type==="U/kg"?"U":"mg";return vals.length>1?`${fmt(vals[0])}–${fmt(vals[1])} ${unit}`:`${fmt(vals[0])} ${unit}`}
function fmt(n){return Number.isInteger(n)?n:n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"")}
function formula(d){return d.type==="fixed"?d.dose:`${d.dose} ${d.type}`}
function renderChips(){let names=["All",...Object.keys(cats).filter(c=>drugs.some(d=>d.category===c))];$("chips").innerHTML=names.map(c=>`<button class="chip ${active===c?"active":""}" data-cat="${esc(c)}">${c==="All"?"All":cats[c].icon+" "+c}</button>`).join("");document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()})}
function render(){
 renderChips();let q=query.toLowerCase();let list=drugs.filter(d=>(active==="All"||d.category===active)&&(!q||[d.name,d.indication,d.route,d.category,d.dose,d.note].join(" ").toLowerCase().includes(q)));
 let by={};list.forEach(d=>(by[d.category]??=[]).push(d));
 $("categories").innerHTML=Object.keys(cats).filter(c=>by[c]?.length).map(c=>`<section class="section" style="--c:${cats[c].color};--c-bg:${cats[c].bg};--c-line:${cats[c].line}"><div class="section-head"><div class="section-icon">${cats[c].icon}</div><div class="section-title">${esc(c)}</div><div class="section-count">${by[c].length}</div></div><div class="cards">${by[c].map(card).join("")}</div></section>`).join("")||'<div class="empty">No medications found</div>';
}
function card(d){let c=cats[d.category]||{color:"#475467",line:"#d0d5dd",bg:"#fff"};let cval=calc(d);return `<article class="card" style="--c:${c.color};--c-line:${c.line}"><div class="cardtop"><div class="drug">${esc(d.name)}</div><div class="route">${esc(d.route)}</div></div><div class="indication">${esc(d.indication)}</div><div class="dosebox"><div class="label">Dose</div><div class="formula">${esc(formula(d))}</div>${cval?`<div class="label calclabel">Calculated dose</div><div class="calc">${esc(cval)}</div>`:""}</div>${d.note?`<div class="note">${esc(d.note)}</div>`:""}</article>`}
function renderAdmin(){let q=$("adminSearch")?.value?.toLowerCase()||"";let arr=drugs.filter(d=>!q||[d.name,d.category,d.indication,d.route,d.dose].join(" ").toLowerCase().includes(q));$("adminList").innerHTML=arr.map(d=>`<div class="row"><div class="rowmain"><div class="rowname">${esc(d.name)}</div><div class="rowsub">${esc(d.category)} · ${esc(d.route)} · ${esc(formula(d))}</div></div><button class="btn" onclick="editDrug('${d.id}')">Edit</button><button class="btn danger" onclick="deleteDrug('${d.id}')">Delete</button></div>`).join("")||'<div class="empty">No medications</div>'}
function openModal(d=null){if(!isAdmin){toast("Sign in as admin first");return}$("modal").innerHTML=`<div class="modal"><h3>${d?"Edit medication":"Add medication"}</h3><form id="drugForm"><div class="form">
<div class="field"><label>Drug name</label><input id="fName" required value="${esc(d?.name||"")}"></div>
<div class="field"><label>Category</label><select id="fCat">${Object.keys(cats).map(c=>`<option ${c===d?.category?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
<div class="field"><label>Indication</label><input id="fInd" value="${esc(d?.indication||"")}"></div>
<div class="field"><label>Route</label><input id="fRoute" value="${esc(d?.route||"")}" placeholder="IV/IO, IM, IN…"></div>
<div class="field"><label>Dose value</label><input id="fDose" required value="${esc(d?.dose||"")}" placeholder="e.g. 5 or 0.1–0.2"></div>
<div class="field"><label>Dose unit</label><select id="fType">${["mg/kg","mcg/kg","mL/kg","U/kg","fixed"].map(x=>`<option ${x===d?.type?"selected":""}>${x}</option>`).join("")}</select></div>

</div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save</button></div></form></div>`;$("modal").classList.add("show");$("cancel").onclick=()=>$("modal").classList.remove("show");$("drugForm").onsubmit=e=>{e.preventDefault();let x={id:d?.id||crypto.randomUUID(),name:$("fName").value.trim(),category:$("fCat").value,indication:$("fInd").value.trim(),route:$("fRoute").value.trim(),dose:$("fDose").value.trim(),type:$("fType").value,note:$("fNote").value.trim()};if(d)drugs=drugs.map(z=>z.id===d.id?x:z);else drugs.push(x);saveCloud();$("modal").classList.remove("show");render();renderAdmin();toast("Saved to Firebase")}}
window.editDrug=id=>openModal(drugs.find(d=>d.id===id));
window.deleteDrug=id=>{if(!isAdmin)return toast("Sign in as admin first");let d=drugs.find(x=>x.id===id);if(confirm(`Delete ${d.name}?`)){drugs=drugs.filter(x=>x.id!==id);saveCloud();render();renderAdmin();toast("Deleted")}};

let isAdmin=false;
$("search").oninput=e=>{query=e.target.value;render()};
$("weight").oninput=e=>{weight=e.target.value;render()};
$("minus").onclick=()=>{let w=Number(weight||0);weight=String(Math.max(0,w-0.5));$("weight").value=weight;render()};
$("plus").onclick=()=>{let w=Number(weight||0);weight=String(w+0.5);$("weight").value=weight;render()};
$("themeBtn").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("pedsDark",document.body.classList.contains("dark"))};
if(localStorage.getItem("pedsDark")==="true")document.body.classList.add("dark");
weight=localStorage.getItem("pedsDoseWeight")||"";$("weight").value=weight;

function showPage(which){$("reference").style.display=which==="ref"?"block":"none";$("admin").classList.toggle("show",which==="admin");$("refTab").classList.toggle("active",which==="ref");$("adminTab").classList.toggle("active",which==="admin");if(which==="admin")renderAdmin()}
$("refTab").onclick=()=>showPage("ref");$("adminTab").onclick=()=>showPage("admin");$("add").onclick=()=>openModal();$("catsBtn").onclick=()=>{if(!isAdmin)return toast("Sign in as admin first");toast("Category editor can be added next")};
$("login").onclick=async()=>{let email=prompt("Admin email");if(!email)return;let pass=prompt("Admin password");if(!pass)return;try{await signInWithEmailAndPassword(auth,email,pass)}catch(e){alert("Sign-in failed: "+e.message)}};
$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{isAdmin=!!user&&user.uid===ADMIN_UID;let status=$("authStatus"),help=$("authHelp");if(isAdmin){status.textContent="Admin access: signed in";help.textContent=user.email||"Authorized administrator";$("login").style.display="none";$("logout").style.display="block"}else if(user){status.textContent="Admin access: denied";help.textContent="This account is not the configured administrator.";$("login").style.display="none";$("logout").style.display="block"}else{status.textContent="Admin access: signed out";help.textContent="Sign in to enable editing.";$("login").style.display="block";$("logout").style.display="none"}renderAdmin()});

onValue(ref(db,"medications"),snap=>{let x=snap.val();if(x){drugs=Object.values(x);saveLocal();render();renderAdmin()}});
onValue(ref(db,"categories"),snap=>{let x=snap.val();if(x){Object.assign(cats,x);saveLocal();render()}});
let cached;try{cached=JSON.parse(localStorage.getItem("pedsDoseDrugs")||"null");if(cached?.length)drugs=cached}catch{}
render();
